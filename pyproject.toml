[project]
name = "ia_maturity"
authors = [
    { name = "IRSAA Business Solutions", email = "erpsupport@irsaa.com" }
]
description = "AlphaX IA Maturity – Internal Audit Function Maturity Assessment (IIA GIAS) for Frappe / ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
